name: Tests
on: [ push ]
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Install Caddy
        run: .github/scripts/install-caddy
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Run tests
        run: |
          yarn
          yarn build:data
          yarn start:server
          yarn test
          yarn stop:server
